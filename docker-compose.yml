version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: schemesathi-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: schemesathi
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p" , "password"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schemesathi-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/schemesathi?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      mysql-db:
        condition: service_healthy

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schemesathi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-app

volumes:
  mysql-data:
