spring:
  application:
    name: schemesathi-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:schemesathi;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      continue-on-error: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock_key_if_not_provided}
        chat:
          options:
            model: gemini-1.5-flash

# Custom Security Settings
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
